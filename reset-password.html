<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="status-strip">
    <span class="status-dot locked"></span>
    <span>session: locked</span>
  </div>

  <div class="card">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a link to set a new password.</p>

    <div class="message" id="formMessage"></div>

    <form id="resetForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>

    <p class="footer-link"><a href="login.html">Back to login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      // redirectTo tells Supabase which page to send the user to
      // after they click the link in the reset email. That page
      // (update-password.html) lets them set a new password.
      const redirectUrl = new URL("update-password.html", window.location.href).toString();

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl,
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      showMessage("If that email has an account, a reset link is on its way.", "success");
      form.reset();
    });
  </script>
</body>
</html>
