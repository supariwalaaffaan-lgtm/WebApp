<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Reset Password — Rodeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header Navigation -->
  <header class="navbar">
    <div class="nav-header-left">
      <a href="index.html" class="nav-brand">
        <img src="img/logo.jpg" alt="Logo" class="brand-logo" />
      </a>
      <div class="nav-headline">THE FIRST RODEO</div>
    </div>
    <div class="nav-links">
      <a href="login.html" class="nav-link">Log in</a>
      <a href="signup.html" class="nav-link">Sign up</a>
    </div>
  </header>

  <div class="card">
    <p class="eyebrow">Account Recovery</p>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a link to set a new password.</p>

    <div class="message" id="formMessage"></div>

    <form id="resetForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
    </form>

    <p class="footer-link"><a href="login.html">Back to login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      const redirectUrl = new URL("update-password.html", window.location.href).href;

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl,
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      showMessage("If that email has an account, a reset link is on its way.", "success");
      form.reset();
    });
  </script>
</body>
</html>
