<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    // Entry point: send password recovery visitors to update-password.html, otherwise normal dashboard/login route.
    (async () => {
      if (window.location.hash.includes("type=recovery") || window.location.search.includes("type=recovery")) {
        window.location.href = "update-password.html" + window.location.hash + window.location.search;
        return;
      }

      const { data } = await supabaseClient.auth.getSession();
       window.location.href = data.session ? ("dashboard.html?t=" + Date.now()) : ("signup.html?t=" + Date.now());
    })();
  </script>
</body>
</html>
