<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="status-strip">
    <span class="status-dot open"></span>
    <span>session: authenticated</span>
  </div>

  <div class="card dash-card">
    <p class="eyebrow">Your account</p>
    <h1>Dashboard</h1>
    <p class="subtitle">This page only loads for logged-in users. Anyone without a valid session gets bounced to the login page.</p>

    <div class="dash-row">
      <span class="dash-label">Username</span>
      <span class="dash-value" id="userUsername">—</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">Email</span>
      <span class="dash-value" id="userEmail">—</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">User ID</span>
      <span class="dash-value" id="userId">—</span>
    </div>
    <div class="dash-row">
      <span class="dash-label">Account created</span>
      <span class="dash-value" id="userCreated">—</span>
    </div>

    <button class="btn-secondary" id="logoutBtn" style="margin-top: 24px;">Log out</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    // Force fresh page load if restored from browser back/forward cache
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    // 1. INSTANT RENDER: Show cached username immediately on load (0ms delay)
    const cachedUser = localStorage.getItem("current_username") || localStorage.getItem("last_username");
    if (cachedUser) {
      document.getElementById("userUsername").textContent = cachedUser;
    }

    // 2. ROUTE GUARD & SESSION VERIFICATION
    (async () => {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        localStorage.removeItem("current_username");
        window.location.href = "login.html?t=" + Date.now();
        return;
      }

      const user = data.session.user;
      let username = user.user_metadata?.username || cachedUser;

      if (!username) {
        try {
          const { data: profile } = await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", user.id)
            .maybeSingle();
          if (profile?.username) username = profile.username;
        } catch (e) {
          console.warn("Could not fetch profile:", e);
        }
      }

      if (username) {
        localStorage.setItem("current_username", username);
        document.getElementById("userUsername").textContent = username;
      }

      document.getElementById("userEmail").textContent = user.email;
      document.getElementById("userId").textContent = user.id;
      document.getElementById("userCreated").textContent = new Date(
        user.created_at
      ).toLocaleDateString();
    })();

    // Keep session in sync
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (!session) {
        localStorage.removeItem("current_username");
        window.location.href = "login.html?t=" + Date.now();
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      localStorage.removeItem("current_username");
      window.location.href = "login.html?t=" + Date.now();
    });
  </script>
</body>
</html>
