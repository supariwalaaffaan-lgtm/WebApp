<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Set New Password — Rodeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header Navigation -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="img/logo.jpg" alt="Logo" class="brand-logo" />
      <span>RODEO<span class="brand-dot">.</span></span>
    </a>
    <div class="nav-links">
      <a href="login.html" class="nav-link">Log in</a>
    </div>
  </header>

  <div class="card">
    <p class="eyebrow">Almost done</p>
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a strong new password for your Rodeo account.</p>

    <div class="message" id="formMessage"></div>

    <form id="updateForm">
      <div class="field">
        <label for="password">New password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" data-target="password" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" placeholder="Repeat your password" required minlength="8" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" data-target="confirmPassword" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Update password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    // Password toggle eye icon
    document.querySelectorAll(".toggle-pwd").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const input = document.getElementById(targetId);
        input.type = input.type === "password" ? "text" : "password";
      });
    });

    const form = document.getElementById("updateForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
    }

    // Listen for recovery session established by Supabase reset link
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        showMessage("Recovery link verified. Please enter your new password below.", "success");
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Those passwords don't match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({ password });

      submitBtn.disabled = false;
      submitBtn.textContent = "Update password";

      if (error) {
        showMessage(error.message, "error");
        return;
      }

      showMessage("Password updated! Redirecting to login...", "success");
      setTimeout(() => {
        window.location.href = "login.html?t=" + Date.now();
      }, 1500);
    });
  </script>
</body>
</html>
