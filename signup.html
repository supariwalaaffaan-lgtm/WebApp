<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="status-strip">
    <span class="status-dot locked" id="statusDot"></span>
    <span id="statusText">session: locked</span>
  </div>

  <div class="card">
    <p class="eyebrow">Get started</p>
    <h1>Create your account</h1>
    <p class="subtitle">Sign up with an email and password. You'll get a confirmation email before you can log in.</p>

    <div class="message" id="formMessage"></div>

    <form id="signupForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
    </form>

    <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Those passwords don't match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";
      document.getElementById("statusDot").className = "status-dot pending";
      document.getElementById("statusText").textContent = "session: authenticating";

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
      });

      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";

      if (error) {
        document.getElementById("statusDot").className = "status-dot locked";
        document.getElementById("statusText").textContent = "session: locked";
        showMessage(error.message, "error");
        return;
      }

      document.getElementById("statusDot").className = "status-dot open";
      document.getElementById("statusText").textContent = "session: confirmation sent";
      showMessage(
        "Account created. Check your email to confirm your address, then log in.",
        "success"
      );
      form.reset();
    });
  </script>
</body>
</html>
